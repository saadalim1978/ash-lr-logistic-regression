[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ashlr"
version = "1.0.0"
description = "Adaptive and numerically stable optimization for ill-conditioned logistic regression"
authors = [{name = "Saad Almusfir"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=1.5", "scipy>=1.9", "matplotlib>=3.6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/saadalim1978/ash-lr-logistic-regression"
